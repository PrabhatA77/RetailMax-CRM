spring.application.name=crm

spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
spring.datasource.username=system
spring.datasource.password=YourPassword123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# Automation rule: flag open contacts with no status change for this many days
crm.automation.followup-days=3

# JWT: the secret must be at least 32 characters. Replace it with your own random string.
crm.jwt.secret=replace-this-with-your-own-long-random-secret-string-123
crm.jwt.expiration-minutes=60

# Default login created on first startup (change the password)
crm.auth.default-username=admin
crm.auth.default-password=admin123