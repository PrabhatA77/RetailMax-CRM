<div class="login-box">
  <h2>Sign in</h2>

  <form (ngSubmit)="submit()">
    <input [(ngModel)]="username" name="username" placeholder="Username" autocomplete="username" />
    <input
      [(ngModel)]="password"
      name="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    />
    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Signing in...' : 'Sign in' }}
    </button>
  </form>

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }
</div>
