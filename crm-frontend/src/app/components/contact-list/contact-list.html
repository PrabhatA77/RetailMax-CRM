<h2>Contacts</h2>

<form (ngSubmit)="save()" autocomplete="off">
  <input [(ngModel)]="name" name="contactName" placeholder="Name" autocomplete="off" />
  <input [(ngModel)]="email" name="contactEmail" placeholder="Email" autocomplete="off" />
  <input [(ngModel)]="phone" name="contactPhone" placeholder="Phone" autocomplete="off" />
  <input [(ngModel)]="company" name="contactCompany" placeholder="Company" autocomplete="off" />
  <button type="submit">{{ editingId() === null ? 'Add Contact' : 'Save Changes' }}</button>
  @if (editingId() !== null) {
    <button type="button" (click)="cancelEdit()">Cancel</button>
  }
</form>

@if (errorMessage()) {
  <p class="error">{{ errorMessage() }}</p>
}

<div class="filter">
  <label>
    Filter by status:
    <select [(ngModel)]="statusFilter" name="statusFilter">
      <option value="ALL">All</option>
      @for (s of statuses; track s.value) {
        <option [value]="s.value">{{ s.label }}</option>
      }
    </select>
  </label>
</div>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Phone</th>
      <th>Company</th>
      <th>Status</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (contact of filteredContacts(); track contact.id) {
      <tr>
        <td>{{ contact.name }}</td>
        <td>{{ contact.email }}</td>
        <td>{{ contact.phone }}</td>
        <td>{{ contact.company }}</td>
        <td>
          <select
            class="status"
            [attr.data-status]="contact.status"
            [ngModel]="contact.status"
            (ngModelChange)="changeStatus(contact, $event)"
          >
            @for (s of statuses; track s.value) {
              <option [value]="s.value">{{ s.label }}</option>
            }
          </select>
        </td>
        <td>
          <button type="button" (click)="edit(contact)">Edit</button>
          <button type="button" (click)="remove(contact)">Delete</button>
        </td>
      </tr>
    } @empty {
      <tr><td colspan="6">No contacts found.</td></tr>
    }
  </tbody>
</table>
